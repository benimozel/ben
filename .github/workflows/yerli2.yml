name: maxterli

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: maxyerliizle-stream
  cancel-in-progress: true

jobs:
  yayin:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
    - name: 📥 Depoyu klonla
      uses: actions/checkout@v4

    - name: 🐍 Python kurulumu
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # ⚡ FFmpeg zaten ubuntu-latest runner'da kurulu geliyor — apt-get'e gerek yok
    # Sadece eksikse kur, hızlı kontrol ile
    - name: 📦 FFmpeg kontrol (hızlı)
      run: |
        if ! command -v ffmpeg &> /dev/null; then
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg
        else
          echo "✅ FFmpeg zaten kurulu: $(ffmpeg -version | head -n1)"
        fi
        pip install --quiet --no-cache-dir requests

    # ⚡ State indirme + yayın başlatma tek adımda, gereksiz bekleme yok
    - name: 🚀 Yayını başlat
      env:
        STATE_FILE_NAME: "state_yerli.json"
        M3U8_URL: "https://v2.catcast.tv/content/50736/seg-27708703-v1-a1/index.m3u8"
        LOGO_URL: "https://i.hizliresim.com/on1bgkjg.png"
        STREAM_KEY: "zirvesa"
      run: |
        curl -sL --max-time 10 "https://github.com/${{ github.repository }}/releases/download/state-data/state_yerli.json" -o state_yerli.json 2>/dev/null || true
        python -u bot.py

    - name: 💾 Son Durumu Release Üzerinde Güncelle
      if: always()
      uses: softprops/action-gh-release@v1
      with:
        files: state_yerli.json
        tag_name: state-data
        name: "Yayın Kaldığı Yer (State)"
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: 🔁 Otomatik Yeniden Tetikle
      if: always() && !(github.event_name == 'push' && cancelled())
      env:
        GH_TOKEN: ${{ secrets.GH_TOKEN }}
      run: |
        curl -s -X POST \
          -H "Authorization: token $GH_TOKEN" \
          -H "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/${{ github.repository }}/actions/workflows/yerli2.yml/dispatches" \
          -d "{\"ref\":\"${{ github.ref_name }}\"}"
